<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Atención Sanitaria</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between font-sans">

    <!-- Audio de fondo en bucle (se reproduce automáticamente) -->
    <audio autoplay loop hidden>
        <source src="Coffee_and_Cartridges.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- Header -->
    <header class="bg-emerald-700 text-white shadow-md py-4 px-6">
        <div class="max-w-3xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold">Atención Sanitaria - Evaluador</h1>
            <span id="progress-indicator" class="text-sm bg-emerald-800 px-3 py-1 rounded-full">Pregunta 1 de 10</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto p-4 sm:p-6 my-auto">
        
        <!-- Card de Pregunta -->
        <div id="quiz-card" class="bg-white rounded-2xl shadow-lg p-6 sm:p-8 transition-all">
            <div id="question-container">
                <h2 id="question-text" class="text-lg sm:text-xl font-semibold text-slate-800 mb-6">Cargando pregunta...</h2>
                <div id="options-container" class="space-y-3">
                    <!-- Opciones generadas dinámicamente -->
                </div>
            </div>

            <!-- Botón Siguiente -->
            <div class="mt-8 flex justify-end">
                <button id="next-btn" onclick="handleNextQuestion()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-6 py-2.5 rounded-xl shadow transition hidden cursor-pointer">
                    Siguiente pregunta
                </button>
            </div>
        </div>

        <!-- Pantalla de Resultados (Oculta por defecto) -->
        <div id="result-card" class="bg-white rounded-2xl shadow-lg p-8 text-center hidden">
            <h2 class="text-2xl font-bold text-slate-800 mb-4">¡Test completado!</h2>
            <p class="text-slate-600 mb-6">Has respondido a todas las preguntas del bloque actual.</p>
            <div class="text-4xl font-extrabold text-emerald-600 mb-6" id="score-text">0 / 10</div>
            <button onclick="restartQuiz()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-8 py-3 rounded-xl shadow transition cursor-pointer">
                Realizar otro test
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-4 text-xs text-slate-500">
        Módulo de Atención Sanitaria &bull; Formación Profesional
    </footer>

    <script>
        // Banco de preguntas ceñido estrictamente al temario práctico (Atención Sanitaria)
        const questionBank = [
            {
                q: "Al medir la temperatura axilar a un paciente encamado, ¿cuánto tiempo se recomienda mantener el termómetro digital clásico colocado correctamente?",
                options: [
                    "Hasta que emita la señal acústica característica.",
                    "Exactamente 30 segundos.",
                    "Al menos 5 minutos fijos.",
                    "10 minutos obligatorios."
                ],
                correct: 0
            },
            {
                q: "Si al realizar la técnica de desinfección de manos con solución hidroalcohólica observamos suciedad visible en las palmas, ¿qué procedimiento debemos seguir según los protocolos higiénico-sanitarios?",
                options: [
                    "Aplicar el doble de gel hidroalcohólico sin retirar la suciedad.",
                    "Lavar las manos previamente con agua y jabón y luego secarlas bien.",
                    "Continuar con el proceso de fricción habitual ignorando la suciedad.",
                    "Utilizar guantes estériles directamente."
                ],
                correct: 1
            },
            {
                q: "¿Cuál es el valor considerado como presión arterial sistólica normal (estándar clínico en reposo para adultos)?",
                options: [
                    "Menor de 120 mmHg.",
                    "Entre 140 y 160 mmHg.",
                    "Exactamente 150 mmHg.",
                    "Menor de 80 mmHg."
                ],
                correct: 0
            },
            {
                q: "Durante la movilización de un paciente encamado para evitar úlceras por presión (UPP), ¿con qué frecuencia estándar se deben realizar los cambios posturales?",
                options: [
                    "Cada 8 horas.",
                    "Cada 2 a 3 horas.",
                    "Una vez al día por la mañana.",
                    "Únicamente cuando el paciente lo solicite."
                ],
                correct: 1
            },
            {
                q: "Ante una situación de obstrucción completa de la vía aérea por cuerpo extraño (OVACE) en un adulto consciente, la maniobra inicial de primeros auxilios recomendada es:",
                options: [
                    "Dar compresiones abdominales continuas (Maniobra de Heimlich).",
                    "Dar 5 golpes interescapulares firmes seguidos de compresiones abdominales.",
                    "Introducir los dedos a ciegas en la boca para extraer el objeto.",
                    "Colocar al paciente en posición lateral de seguridad inmediatamente."
                ],
                correct: 1
            },
            {
                q: "En la técnica de higiene de un paciente encamado, ¿qué zona corporal debe lavarse en primer lugar para mantener los principios de asepsia correctos?",
                options: [
                    "La zona genital y anal.",
                    "Las extremidades inferiores.",
                    "Los ojos y la cara (sin jabón en los ojos).",
                    "El tórax y el abdomen."
                ],
                correct: 2
            },
            {
                q: "Al preparar un carro de curas, ¿cómo debe clasificarse el material de desecho biocontaminado o punzante (como agujas usadas)?",
                options: [
                    "En el contenedor general de residuos urbanos.",
                    "En el contenedor específico rígido de riesgos biológicos y punzantes.",
                    "En una bolsa de plástico negra común bien cerrada.",
                    "Directamente en el lavabo con abundante agua."
                ],
                correct: 1
            },
            {
                q: "Al realizar la técnica de traslado desde la cama a una silla de ruedas, lo primero que debemos comprobar por seguridad es:",
                options: [
                    "Que las ruedas de la silla estén frenadas y los reposapiés retirados o abatidos.",
                    "Que la silla sea de color azul.",
                    "Que el paciente tenga los zapatos puestos obligatoriamente.",
                    "Que la ventana de la habitación esté abierta."
                ],
                correct: 0
            },
            {
                q: "¿Qué nombre recibe el pulso periférico que se palpa en la zona de la muñeca, sobre la arteria radial?",
                options: [
                    "Pulso carotídeo.",
                    "Pulso radial.",
                    "Pulso apical.",
                    "Pulso pedio."
                ],
                correct: 1
            },
            {
                q: "En la administración de medicación por vía tópica cutánea, es una buena práctica clínica:",
                options: [
                    "Extender la crema con la mano descubierta sin protección.",
                    "Utilizar guantes limpios y aplicar la pomada realizando un suave masaje según prescripción.",
                    "Mezclar varios medicamentos tópicos en el mismo envase antes de aplicarlos.",
                    "Limpiar la zona previamente con alcohol de 96 grados de forma enérgica."
                ],
                correct: 1
            }
        ];

        let currentQuizQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;

        function initQuiz() {
            const shuffledBank = [...questionBank].sort(() => Math.random() - 0.5);
            currentQuizQuestions = shuffledBank.slice(0, 10);
            currentIndex = 0;
            score = 0;
            
            document.getElementById('quiz-card').classList.remove('hidden');
            document.getElementById('result-card').classList.add('hidden');
            loadQuestion();
        }

        function loadQuestion() {
            selectedOptionIndex = null;
            document.getElementById('next-btn').classList.add('hidden');
            
            const qData = currentQuizQuestions[currentIndex];
            document.getElementById('progress-indicator').innerText = `Pregunta ${currentIndex + 1} de ${currentQuizQuestions.length}`;
            document.getElementById('question-text').innerText = qData.q;

            let indexedOptions = qData.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            indexedOptions.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            indexedOptions.forEach((item) => {
                const button = document.createElement('button');
                button.className = "w-full text-left p-4 rounded-xl border border-slate-200 hover:border-emerald-500 hover:bg-emerald-50 transition font-medium text-slate-700 cursor-pointer flex items-center justify-between";
                button.innerHTML = `<span>${item.text}</span>`;
                
                button.onclick = () => selectOption(button, item.originalIndex, qData.correct);
                optionsContainer.appendChild(button);
            });
        }

        function selectOption(buttonElement, originalIdx, correctIdx) {
            const allButtons = document.getElementById('options-container').children;
            
            for (let btn of allButtons) {
                btn.classList.remove('border-emerald-600', 'bg-emerald-50', 'ring-2', 'ring-emerald-600');
            }

            buttonElement.classList.add('border-emerald-600', 'bg-emerald-50', 'ring-2', 'ring-emerald-600');
            selectedOptionIndex = originalIdx;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function handleNextQuestion() {
            if (selectedOptionIndex === null) return;

            const qData = currentQuizQuestions[currentIndex];
            if (selectedOptionIndex === qData.correct) {
                score++;
            }

            currentIndex++;

            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('score-text').innerText = `${score} / ${currentQuizQuestions.length}`;
        }

        function restartQuiz() {
            initQuiz();
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
