<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAPSD Arcade Edition - Tema 1: Prácticas Sociosanitarias</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Press Start 2P para la estética Arcade Retro -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        .font-arcade {
            font-family: 'Press Start 2P', monospace;
        }
        .font-pixel {
            font-family: 'VT323', monospace;
        }
        body {
            background-color: #05050a;
            background-image: 
                linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), 
                linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            background-size: 100% 4px, 6px 100%;
        }
        .arcade-glow {
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.4), inset 0 0 15px rgba(34, 211, 238, 0.2);
        }
        .arcade-glow-btn:hover {
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.8);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between text-cyan-400 selection:bg-yellow-400 selection:text-black p-4">

    <!-- Audio de fondo en bucle -->
    <audio autoplay loop hidden>
        <source src="Coffee_and_Cartridges.mp3" type="audio/mpeg">
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- Header Arcade -->
    <header class="w-full max-w-3xl mx-auto border-2 border-cyan-500 bg-black/80 rounded-lg p-4 shadow-lg my-2 flex flex-col sm:flex-row justify-between items-center gap-4 arcade-glow">
        <div class="flex items-center gap-3">
            <span class="inline-block w-4 h-4 bg-yellow-400 animate-pulse"></span>
            <h1 class="font-arcade text-xs sm:text-sm tracking-wider text-yellow-300">TEMA 1: PRÁCTICA SOCIOSANITARIA</h1>
        </div>
        <div id="progress-indicator" class="font-pixel text-xl sm:text-2xl text-cyan-300 bg-cyan-950/60 px-4 py-1 border border-cyan-700 rounded">
            FASE 1 / 10
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-3xl w-full mx-auto my-auto py-2">
        
        <!-- Card de Pregunta Estilo Consola Retro -->
        <div id="quiz-card" class="bg-slate-950/90 border-2 border-cyan-500 rounded-xl p-6 sm:p-8 arcade-glow shadow-2xl relative">
            <div class="absolute -top-3 left-6 bg-black px-2 font-arcade text-[10px] text-cyan-400 border border-cyan-500">
                PANTALLA DE PREGUNTA
            </div>

            <div id="question-container" class="mt-2">
                <h2 id="question-text" class="font-pixel text-2xl sm:text-3xl text-cyan-100 mb-6 leading-relaxed tracking-wide">
                    Cargando datos del sistema...
                </h2>
                <div id="options-container" class="space-y-3">
                    <!-- Opciones generadas dinámicamente -->
                </div>
            </div>

            <!-- Botón Siguiente -->
            <div class="mt-8 flex justify-end">
                <button id="next-btn" onclick="handleNextQuestion()" class="font-arcade text-xs bg-yellow-500 hover:bg-yellow-400 text-black font-bold px-6 py-3 rounded border-2 border-yellow-300 transition hidden cursor-pointer arcade-glow-btn">
                    SIGUIENTE &gt;&gt;
                </button>
            </div>
        </div>

        <!-- Pantalla de Resultados (Oculta por defecto) -->
        <div id="result-card" class="bg-slate-950/90 border-2 border-yellow-500 rounded-xl p-8 text-center hidden shadow-2xl">
            <h2 class="font-arcade text-sm sm:text-base text-yellow-400 mb-4 animate-bounce">¡MISIÓN CUMPLIDA!</h2>
            <p class="font-pixel text-xl text-slate-300 mb-6">Has superado el test práctico del Tema 1.</p>
            <div class="font-arcade text-3xl sm:text-4xl text-cyan-300 mb-8 py-4 bg-black/60 border border-cyan-500 rounded inline-block px-8" id="score-text">
                0 / 10
            </div>
            <div>
                <button onclick="restartQuiz()" class="font-arcade text-xs bg-cyan-500 hover:bg-cyan-400 text-black font-bold px-8 py-3 rounded border-2 border-cyan-300 transition cursor-pointer arcade-glow-btn">
                    JUGAR DE NUEVO
                </button>
            </div>
        </div>

    </main>

    <!-- Footer Retro -->
    <footer class="text-center py-3 font-pixel text-lg text-slate-500 tracking-wider">
        MÓDULO TAPSD &bull; ARCADE EDITION
    </footer>

    <span class="hidden">
        <!-- Citations placeholder for compliance if needed -->
    </span>

    <script>
        // Banco de preguntas práctico basado en todo el Tema 1 (sin autores ni teorías explícitas)
        const questionBank = [
            {
                q: "A la hora de planificar actividades para un usuario, debemos entender a la persona como un ser multidimensional que comprende las siguientes esferas:",
                options: [
                    "Biológica, psíquica y social.",
                    "Únicamente física y económica.",
                    "Motora, intelectual y laboral.",
                    "Genética, clínica y farmacológica."
                ],
                correct: 0
            },
            {
                q: "Cuando en un centro residencial se programan actividades dirigidas a despertar las capacidades motrices y los sentidos, especialmente en niños o colectivos específicos, nos referimos a:",
                options: [
                    "Cuidados de estimulación.",
                    "Cuidados de compensación.",
                    "Cuidados de sosiego.",
                    "Cuidados de autoimagen."
                ],
                correct: 0
            },
            {
                q: "Si un profesional aplica intervenciones orientadas a calmar el dolor y aportar serenidad y liberación de tensiones al usuario, está prestando:",
                options: [
                    "Cuidados de sosiego.",
                    "Cuidados de estimulación.",
                    "Cuidados de conservación.",
                    "Cuidados de confirmación."
                ],
                correct: 0
            },
            {
                q: "Cuando realizamos actividades asistenciales destinadas a suplir aquellas funciones o capacidades que el usuario no adquirió o perdió, empleamos:",
                options: [
                    "Cuidados de compensación.",
                    "Cuidados de conservación de la vida.",
                    "Cuidados de estimulación sensorial.",
                    "Cuidados de autoimagen."
                ],
                correct: 0
            },
            {
                q: "Para mantener las capacidades adquiridas y asegurar la autonomía el mayor tiempo posible en personas dependientes, el tipo de cuidado indicado es el de:",
                options: [
                    "Conservación y continuidad de la vida.",
                    "Compensación total de funciones.",
                    "Estimulación psicomotriz infantil.",
                    "Sosiego y alivio del dolor agudo."
                ],
                correct: 0
            },
            {
                q: "Al adecuar el domicilio de una persona mayor con movilidad reducida, ¿cómo deben ser preferiblemente los suelos para prevenir accidentes?",
                options: [
                    "Antideslizantes, evitando alfombras u objetos que entorpezcan el paso.",
                    "De parqué encerado muy brillante y pulido.",
                    "Cubiertos completamente de alfombras gruesas para amortiguar caídas.",
                    "De moqueta suelta sin fijar al suelo."
                ],
                correct: 0
            },
            {
                q: "Respecto a la climatización y regulación de la temperatura en la vivienda de un usuario dependiente, se desaconseja expresamente el uso de:",
                options: [
                    "Braseros tradicionales, debido al alto riesgo de intoxicación por monóxido de carbono.",
                    "Sistemas de aire acondicionado con control digital de temperatura.",
                    "Radiadores de aceite eléctricos homologados.",
                    "Humidificadores ambientales en estancias secas."
                ],
                correct: 0
            },
            {
                q: "En relación con las condiciones de iluminación en el hogar de un usuario anciano, esta debe asegurar que:",
                options: [
                    "Exista luz suficiente para ver sin forzar la vista y que los interruptores sean accesibles desde la cama o la entrada.",
                    "Las bombillas sean de intensidad muy baja para no molestar la vista.",
                    "Los interruptores estén situados únicamente en el exterior de las habitaciones.",
                    "Se dependa exclusivamente de la luz natural exterior."
                ],
                correct: 0
            },
            {
                q: "Dentro de las estrategias para promover los autocuidados en los usuarios, una de las líneas clave consiste en:",
                options: [
                    "Desarrollar la autoestima y favorecer la responsabilidad individual y comunitaria.",
                    "Imponer normas estrictas de cumplimiento obligatorio sin consultar al usuario.",
                    "Sustituir por completo al usuario en todas sus decisiones cotidianas.",
                    "Evitar cualquier tipo de participación grupal o social."
                ],
                correct: 0
            },
            {
                q: "Cuál es una de las herramientas fundamentales que utiliza el profesional de atención sociosanitaria para educar, orientar y reforzar los hábitos de autocuidado en los usuarios:",
                options: [
                    "La educación para la salud.",
                    "La restricción farmacológica nocturna.",
                    "El aislamiento preventivo domiciliario.",
                    "La simplificación administrativa de historiales."
                ],
                correct: 0
            },
            {
                q: "En cuanto a la arquitectura de la vivienda para facilitar el tránsito de personas con productos de apoyo o sillas de ruedas, se recomienda:",
                options: [
                    "Disponer de puertas amplias, pasamanos y rampas alternativas si hay escalones.",
                    "Mantener umbrales de puertas elevados para delimitar las habitaciones.",
                    "Sustituir las puertas por cortinas opacas para ganar espacio.",
                    "Instalar escaleras de caracol para optimizar los metros útiles."
                ],
                correct: 0
            },
            {
                q: "La competencia general del título profesional de atención a personas en situación de dependencia se orienta principalmente a:",
                options: [
                    "Atender a las personas en el ámbito domiciliario e institucional para mantener y mejorar su calidad de vida.",
                    "Realizar intervenciones quirúrgicas de alta complejidad en hospitales.",
                    "Gestionar exclusivamente los recursos financieros de centros sociales.",
                    "Impartir docencia universitaria en ciencias de la salud."
                ],
                correct: 0
            },
            {
                q: "Cuando un profesional utiliza la comunicación no verbal y apoya la construcción de la imagen personal del usuario, está prestando cuidados centrados en:",
                options: [
                    "La autoimagen.",
                    "El sosiego absoluto.",
                    "La estimulación motora básica.",
                    "La compensación orgánica."
                ],
                correct: 0
            },
            {
                q: "El concepto actual de salud impulsado en los modelos asistenciales se aleja de la mera ausencia de enfermedad para concebirse como:",
                options: [
                    "Un estado completo de bienestar físico, psíquico, social y dinámico con el entorno.",
                    "Una condición estática invariable determinada únicamente por la genética.",
                    "Un indicador puramente económico de productividad laboral.",
                    "La resistencia biológica exclusiva frente a infecciones agudas."
                ],
                correct: 0
            },
            {
                q: "Durante la valoración inicial de un plan de cuidados individualizado, la fase de la enfermedad en la que esta todavía no se manifiesta clínicamente se denomina:",
                options: [
                    "Periodo prepatogénico.",
                    "Periodo de enfermedad manifiesta.",
                    "Fase de secuelas incapacitantes.",
                    "Estadio terminal de dependencia."
                ],
                correct: 0
            }
        ];

        let currentQuizQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedOptionIndex = null;

        // Inicializar el test seleccionando 10 preguntas aleatorias
        function initQuiz() {
            const shuffledBank = [...questionBank].sort(() => Math.random() - 0.5);
            currentQuizQuestions = shuffledBank.slice(0, 10);
            currentIndex = 0;
            score = 0;
            
            document.getElementById('quiz-card').classList.remove('hidden');
            document.getElementById('result-card').classList.add('hidden');
            loadQuestion();
        }

        // Cargar pregunta y mezclar aleatoriamente las opciones
        function loadQuestion() {
            selectedOptionIndex = null;
            document.getElementById('next-btn').classList.add('hidden');
            
            const qData = currentQuizQuestions[currentIndex];
            document.getElementById('progress-indicator').innerText = `FASE ${currentIndex + 1} / ${currentQuizQuestions.length}`;
            document.getElementById('question-text').innerText = qData.q;

            // Mapear opciones con índice original para rastrear la correcta
            let indexedOptions = qData.options.map((opt, idx) => ({ text: opt, originalIndex: idx }));
            
            // Aleatorizar el orden de las respuestas en cada carga
            indexedOptions.sort(() => Math.random() - 0.5);

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            indexedOptions.forEach((item) => {
                const button = document.createElement('button');
                button.className = "w-full text-left font-pixel text-xl sm:text-2xl p-4 rounded-lg border-2 border-cyan-800 bg-black/60 text-cyan-300 hover:border-yellow-400 hover:bg-cyan-950/80 hover:text-yellow-300 transition cursor-pointer flex items-center justify-between shadow";
                button.innerHTML = `<span>&gt; ${item.text}</span>`;
                
                button.onclick = () => selectOption(button, item.originalIndex, qData.correct);
                optionsContainer.appendChild(button);
            });
        }

        // Seleccionar opción
        function selectOption(buttonElement, originalIdx, correctIdx) {
            const allButtons = document.getElementById('options-container').children;
            
            for (let btn of allButtons) {
                btn.classList.remove('border-yellow-400', 'bg-cyan-950', 'text-yellow-300', 'ring-2', 'ring-yellow-400');
            }

            buttonElement.classList.add('border-yellow-400', 'bg-cyan-950', 'text-yellow-300', 'ring-2', 'ring-yellow-400');
            selectedOptionIndex = originalIdx;
            
            document.getElementById('next-btn').classList.remove('hidden');
        }

        // Siguiente pregunta (Control estricto de las 10 preguntas)
        function handleNextQuestion() {
            if (selectedOptionIndex === null) return;

            const qData = currentQuizQuestions[currentIndex];
            if (selectedOptionIndex === qData.correct) {
                score++;
            }

            currentIndex++;

            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        // Mostrar resultados
        function showResults() {
            document.getElementById('quiz-card').classList.add('hidden');
            document.getElementById('result-card').classList.remove('hidden');
            document.getElementById('score-text').innerText = `${score} / ${currentQuizQuestions.length}`;
        }

        // Reiniciar
        function restartQuiz() {
            initQuiz();
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
