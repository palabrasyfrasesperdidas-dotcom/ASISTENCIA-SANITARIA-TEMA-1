<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TAPSD Arcade Edition - Tema 1</title>
    <!-- Corrección en la importación de Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #05050a;
            color: #22d3ee;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px 20px;
            text-align: center;
            overflow-x: hidden;
        }
        #arcade-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 10, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            transition: opacity 0.5s ease;
            padding: 20px;
        }

        /* Botón de música reposicionado en la parte inferior, centrado */
        .audio-control-btn {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Press Start 2P', monospace;
            font-size: 0.65rem;
            color: #ffcc00;
            background: rgba(3, 7, 18, 0.95);
            border: 2px solid #06b6d4;
            padding: 12px 16px;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(6, 182, 212, 0.3);
            z-index: 9999; /* Asegura que se dibuje por encima de todo */
            transition: all 0.2s ease;
        }
        .audio-control-btn:hover {
            background: #06b6d4;
            color: #000;
            box-shadow: 0 0 15px #06b6d4;
        }

        .arcade-splash-content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 520px;
            width: 100%;
            border: 2px solid #06b6d4;
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.3);
            background-color: rgba(3, 7, 18, 0.95);
            padding: 30px 20px;
            border-radius: 14px;
        }
        .arcade-title-pixel {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.95rem;
            color: #ffcc00;
            text-shadow: 2px 2px #d6249f;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .arcade-subtitle-pixel {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.75rem;
            color: #22d3ee;
            margin-bottom: 25px;
        }

        @keyframes floatUpDown {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
            100% { transform: translateY(0px); }
        }

        .arcade-image-container {
            width: 130px;
            height: 110px;
            border-radius: 12px;
            border: 2px solid #06b6d4;
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
            margin-bottom: 30px;
            background: rgba(8, 47, 73, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            animation: floatUpDown 3s ease-in-out infinite;
        }
        .press-start-btn {
            font-family: 'Press Start 2P', monospace;
            font-size: 0.85rem;
            color: #000;
            background: #eab308;
            border: 2px solid #fef08a;
            padding: 16px 24px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(234, 179, 8, 0.5);
        }
        #main-content {
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.8s ease;
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        #main-content.active {
            opacity: 1;
            visibility: visible;
        }
        .header-box, .content-box {
            width: 100%;
            background-color: rgba(3, 7, 18, 0.95);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid #06b6d4;
        }
    </style>
</head>
<body>

    <!-- Elemento de audio -->
    <audio id="bg-music" src="Coffee_and_Cartridges.mp3" loop></audio>

    <div id="arcade-splash">
        <div class="arcade-splash-content">
            <div class="arcade-title-pixel">ATENCIÓN SOCIOSANITARIA</div>
            <div class="arcade-subtitle-pixel">EDICIÓN RETRO ARCADE</div>

            <div class="arcade-image-container">
                <div style="font-size: 2.8rem; display: flex; gap: 8px;">👩‍⚕️ 💊</div>
            </div>

            <button class="press-start-btn" type="button" onclick="startAdventure()">PULSA PARA COMENZAR &gt;&gt;</button>
        </div>

        <!-- Botón de control de música, ahora en la parte inferior de la pantalla -->
        <button class="audio-control-btn" onclick="toggleMusic(event)">🔇 MÚSICA: OFF</button>
    </div>

    <div id="main-content">
        <header class="header-box">
            <h1 style="font-family: 'Press Start 2P', monospace; font-size: 0.75rem; color: #fef08a;">TEMA 1: PRÁCTICA SOCIOSANITARIA</h1>
        </header>
        <section class="content-box">
            <p style="color: #e2e8f0; line-height: 1.6;">¡Bienvenida a la simulación del módulo de Atención Sociosanitaria!</p>
        </section>
    </div>

    <script>
        const music = document.getElementById('bg-music');
        const musicBtn = document.querySelector('.audio-control-btn');

        function toggleMusic(event) {
            event.stopPropagation();

            if (music.paused) {
                music.play().catch(error => console.log("Interacción requerida:", error));
                musicBtn.textContent = "🔊 MÚSICA: ON";
                musicBtn.style.color = "#22d3ee";
            } else {
                music.pause();
                musicBtn.textContent = "🔇 MÚSICA: OFF";
                musicBtn.style.color = "#ffcc00";
            }
        }

        function startAdventure() {
            document.getElementById('arcade-splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('arcade-splash').style.display = 'none';
                document.getElementById('main-content').classList.add('active');
            }, 500);
        }
    </script>
</body>
</html>
